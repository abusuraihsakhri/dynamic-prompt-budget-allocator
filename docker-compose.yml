version: '3.8'

services:
  dynamic-prompt-budget-allocator:
    build: .
    container_name: dynamic-prompt-budget-allocator
    ports:
      - "8000:8000"
    environment:
      # IMPORTANT: Override this in production with a strong random key
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-change-me-in-production}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
