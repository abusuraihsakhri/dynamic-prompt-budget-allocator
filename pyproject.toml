[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-prompt-budget-allocator"
version = "2.0.0"
description = "PromptBudgeter: Dynamic Token Budgeting & Key-Value Cache Compressor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dynamic-prompt-budget-allocator = "prompt_budgeter.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dynamic-prompt-budget-allocator"
Repository = "https://github.com/abusuraihsakhri/dynamic-prompt-budget-allocator.git"
