name: Publish static allocator
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed HTML and JavaScript assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "${base}/" -o /tmp/allocator-page.html \
              && grep -Fq 'id="calculate"' /tmp/allocator-page.html \
              && curl --fail --silent --show-error --location --max-time 20 "${base}/allocator.js" -o /tmp/allocator.js \
              && curl --fail --silent --show-error --location --max-time 20 "${base}/app.js" -o /tmp/allocator-app.js \
              && node --check /tmp/allocator.js \
              && node --check /tmp/allocator-app.js; then
              echo "Deployed HTML and JavaScript assets verified at ${PAGE_URL}"
              exit 0
            fi
            sleep 5
          done
          echo "Live GitHub Pages smoke check failed" >&2
          exit 1
